repository.workspace = true

[[bin]]
name = "jet"
path = "src/main.rs"

[features]
default = []
vulkan = ["jet-engine/vulkan"]
vision = ["jet-engine/vision", "dep:base64"]

[dependencies]
clap.workspace = true
