[project]
name = "jet-training"
version = "0.1.0"
description = "Reproducible candidate-aligned LoRA training for JET"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==5.0.1",
    "transformers==5.17.0",
]

[project.optional-dependencies]
train = [
    "accelerate==1.15.0",
    "peft==0.21.1",
    "torch==2.10.0",
]
convert = ["gguf", "sentencepiece", "mistral-common", "protobuf"]

[dependency-groups]
dev = ["ruff==0.16.9"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
