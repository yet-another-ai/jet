name: Documentation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: VitePress
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
        env:
          MISE_GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
        with:
          version: 2026.10.0
          add_shims_to_path: false
          install_args: --locked node pnpm
          github_token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          cache_save: ${{ github.event_name != 'pull_request' }}
          cache_key_prefix: jet-mise-docs-v1
      - name: Install documentation dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Build documentation
        run: mise exec -- pnpm docs:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
