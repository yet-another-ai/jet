name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  docs:
    name: Documentation
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [test, build, docs]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$DOCS_RESULT" != "success" ]]; then
            echo "::error::Required CI jobs did not succeed (Test: $TEST_RESULT, Build: $BUILD_RESULT, Documentation: $DOCS_RESULT)."
            exit 1
          fi

  deploy-docs:
    name: Deploy documentation
    if: ${{ !cancelled() && needs.gate.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs: [gate]
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
