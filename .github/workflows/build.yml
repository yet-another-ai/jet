name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  JET_CPU_PORTABLE: '1'

jobs:
  package:
    name: CPU package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux-x64
          - os: ubuntu-26.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - name: Require Apple Silicon before macOS compilation
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          [[ "$RUNNER_ARCH" == ARM64 && "$(uname -m)" == arm64 ]]
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-cpu
        with:
          cache-scope: release-default
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
      - name: Build CPU archive and smoke test extracted CLI
        run: cargo xtask package --platform ${{ matrix.platform }}
      - name: Upload CPU archive
        uses: actions/upload-artifact@v7
        with:
          name: jet-cpu-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Save trusted build cache
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            target
          key: ${{ env.JET_BUILD_CACHE_KEY }}
