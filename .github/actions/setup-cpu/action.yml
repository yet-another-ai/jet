name: Set up CPU build
description: Install only locked Rust/CMake tools and restore isolated CPU build caches.
inputs:
  cache-scope:
    description: Separate check and release build trees, including CPU feature configuration.
    required: true
  github-token:
    description: Optional download token. Empty on every pull request, including same-repository PRs.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install locked build tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        version: 2026.10.0
        install_args: --locked rust cmake
        github_token: ${{ inputs.github-token }}
        cache_save: ${{ github.event_name != 'pull_request' }}
        cache_key_prefix: jet-mise-cpu-v1-${{ runner.os }}-${{ runner.arch }}
    - name: Identify native build inputs
      id: native
      shell: bash
      run: |
        echo "llama=$(git rev-parse HEAD:vendor/llama.cpp)" >> "$GITHUB_OUTPUT"
        rustc --version
        cmake --version
    - name: Restore dependency and native build cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: cache
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          target
        key: jet-cpu-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ inputs.cache-scope }}-${{ hashFiles('mise.toml', 'mise.lock', 'Cargo.lock', '**/Cargo.toml', 'crates/**/build.rs') }}-${{ steps.native.outputs.llama }}-${{ github.sha }}
        restore-keys: |
          jet-cpu-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ inputs.cache-scope }}-${{ hashFiles('mise.toml', 'mise.lock', 'Cargo.lock', '**/Cargo.toml', 'crates/**/build.rs') }}-${{ steps.native.outputs.llama }}-
    # Only trusted main/manual runs publish caches; PRs may restore them.
    - name: Register cache key
      shell: bash
      env:
        CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
      run: echo "JET_BUILD_CACHE_KEY=$CACHE_KEY" >> "$GITHUB_ENV"
