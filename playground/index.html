<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Jet WebGPU Playground</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      const storedTheme = localStorage.getItem('jet-playground-theme');
      document.documentElement.dataset.theme =
        storedTheme === 'dark' || storedTheme === 'light'
          ? storedTheme
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
    </script>
    <!--
      GitHub Pages cannot set COOP/COEP. The service worker patches those headers
      so SharedArrayBuffer / Wasm atomics work. When Vite already sends the
      headers (dev/preview), the script no-ops because crossOriginIsolated is set.
    -->
    <script src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
